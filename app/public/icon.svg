<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <clipPath id="round"><rect width="1024" height="1024" rx="230"/></clipPath>
  <g clip-path="url(#round)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A4A"/>
      <stop offset="0.45" stop-color="#F0561A"/>
      <stop offset="1" stop-color="#8E1F07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#3B0A02" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B0A02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="needleN" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="0.5" stop-color="#FFC21A"/>
      <stop offset="0.51" stop-color="#F29A00"/>
      <stop offset="1" stop-color="#D97F00"/>
    </linearGradient>
    <linearGradient id="needleS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F3F4F6"/>
      <stop offset="0.51" stop-color="#D5D9DE"/>
      <stop offset="1" stop-color="#BFC5CC"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9AA3AD"/>
    </radialGradient>
    <linearGradient id="gullBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E9EE"/>
    </linearGradient>
    <linearGradient id="gullWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3CCD4"/>
      <stop offset="1" stop-color="#8F9BA6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3B0A02" flood-opacity="0.45"/>
    </filter>
    <clipPath id="disk"><circle cx="470" cy="560" r="300"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#deep)"/>
  <path d="M0 0 H1024 V300 C 760 380, 300 250, 0 360 Z" fill="#FFFFFF" opacity="0.10"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Schatzkarten-Route im Hintergrund -->
  <path d="M720 760 C 790 800, 760 860, 846 872" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 32"/>
  <path d="M858 848 l52 52 m0 -52 l-52 52" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="20" stroke-linecap="round"/>

  <!-- Schatten unter der Glasscheibe -->
  <ellipse cx="480" cy="890" rx="250" ry="40" fill="#3B0A02" opacity="0.45" filter="url(#soft)"/>

  <!-- Glas-Kompass -->
  <g filter="url(#drop)">
    <circle cx="470" cy="560" r="300" fill="url(#glass)"/>
  </g>
  <circle cx="470" cy="560" r="300" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="470" cy="560" r="248" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Skala -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M470 290 V330 M470 790 V830 M200 560 H240 M700 560 H740" stroke-width="12"/>
    <path d="M280 370 L300 390 M660 370 L640 390 M280 750 L300 730 M660 750 L640 730" stroke-width="7" stroke-opacity="0.6"/>
  </g>
  <!-- Nadel -->
  <g transform="rotate(35 470 560)" filter="url(#drop)">
    <path d="M470 330 L520 560 L470 540 L420 560 Z" fill="url(#needleN)"/>
    <path d="M470 790 L520 560 L470 580 L420 560 Z" fill="url(#needleS)"/>
  </g>
  <circle cx="470" cy="560" r="30" fill="url(#hub)"/>
  <circle cx="470" cy="560" r="12" fill="#C2410C"/>
  <!-- Glanzlicht auf dem Glas -->
  <g clip-path="url(#disk)">
    <ellipse cx="430" cy="380" rx="290" ry="170" fill="url(#gloss)" opacity="0.8"/>
  </g>

  <!-- Lilli sitzt auf dem Rand -->
  <g transform="translate(497 45) scale(3.2)" filter="url(#drop)">
    <path d="M30 60 L6 49 L13 71 Z" fill="#7D8893"/>
    <ellipse cx="58" cy="62" rx="33" ry="23" fill="url(#gullBody)"/>
    <path d="M34 58 Q58 34 86 57 Q62 77 34 66 Z" fill="url(#gullWing)"/>
    <path d="M34 58 Q41 53 47 56 L39 66 Z" fill="#2F363C"/>
    <circle cx="88" cy="40" r="17" fill="url(#gullBody)"/>
    <path d="M72 32 Q88 15 104 32 Z" fill="#14202B"/>
    <rect x="71" y="30" width="34" height="5" rx="2.5" fill="#FF7A1A"/>
    <path d="M104 40 L119 44 L104 48 Z" fill="#FFB020"/>
    <circle cx="111.5" cy="46" r="1.8" fill="#E5484D"/>
    <circle cx="94" cy="39" r="3.4" fill="#14202B"/>
    <circle cx="95.2" cy="37.8" r="1.1" fill="#FFFFFF"/>
    <path d="M52 84 L50 96 M66 84 L68 96" stroke="#FF9F43" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Glanz auf Lilli -->
    <ellipse cx="80" cy="33" rx="8" ry="4" fill="#FFFFFF" opacity="0.8"/>
  </g>

  </g>
</svg>
