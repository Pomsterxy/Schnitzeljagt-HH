name: App veröffentlichen (GitHub Pages)

# Baut die App bei jeder Änderung auf main, testet sie und legt das Ergebnis
# in den Zweig gh-pages. GitHub Pages zeigt diesen Zweig unter
# https://<benutzer>.github.io/<repo>/ an.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - name: Für GitHub Pages vorbereiten
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          branch: gh-pages
